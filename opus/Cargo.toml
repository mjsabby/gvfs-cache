[workspace]
resolver = "3"
members = [".", "crates/gvfs-alloc-guard", "crates/gvfs-mmap", "crates/gvfs-prefetch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

# Invariant 1 (100% safe Rust) and invariant 2 (zero panics) hold for every crate that
# opts into `[lints] workspace = true`. The three tiny crates that cannot (`gvfs-alloc-guard`:
# `unsafe impl GlobalAlloc`; `gvfs-mmap`: one `mmap(2)` of an immutable file; `gvfs-prefetch`:
# one `_mm_prefetch` hint) re-declare the same clippy denials and confine their `unsafe` to a
# single documented item each.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[package]
name = "gvfs-daemon"
description = "Unified GVFS monorepo acceleration layer: one binary for the scheduled slab pipeline and the edge / localhost server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gvfs_daemon"
path = "src/lib.rs"

[[bin]]
name = "gvfs-daemon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gvfs-alloc-guard = { path = "crates/gvfs-alloc-guard" }
gvfs-mmap = { path = "crates/gvfs-mmap" }
gvfs-prefetch = { path = "crates/gvfs-prefetch" }
# zlib with SIMD inflate/deflate/adler32, used through its safe streaming API.
zlib-rs = "0.6"
# SHA-1 with runtime-detected SHA-NI.
sha1 = "0.10"
# Safe wrappers for sendfile(2).
nix = { version = "0.29", default-features = false, features = ["fs", "zerocopy", "socket", "event", "resource"] }
# HTTPS to the upstream and to Azure Blob; ring also provides HMAC-SHA256 / SHA-256.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
# The edge's runtime: one task per connection, timers, the arena semaphore (REPORT.md §14),
# and the child processes of a local upstream.
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "process"] }
# The edge's async HTTP client (`src/aclient.rs`): hyper's client connections, TLS by rustls.
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Only `examples/spike_tokio.rs` (the connection-layer experiment) uses these.
[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
hyper = { version = "1.12", features = ["server", "http1"] }
http-body = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 2
