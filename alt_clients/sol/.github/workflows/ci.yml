name: Rust checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked --message-format=short
      - run: cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings
