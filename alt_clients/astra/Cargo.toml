[workspace]
members = [".", "crates/alloc-guard"]
resolver = "3"

[package]
name = "gvfs-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
alloc-guard = { path = "crates/alloc-guard" }
arc-swap = "1.7"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
fs2 = "0.4"
hmac = "0.12"
httparse = "1"
memmap2 = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["zerocopy"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[[bench]]
name = "engine"
harness = false
