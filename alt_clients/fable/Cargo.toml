[workspace]
resolver = "3"
members = [
    "crates/gvfs-mmap",
    "crates/gvfs-alloc-guard",
    "crates/gvfs-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
gvfs-mmap = { path = "crates/gvfs-mmap" }
gvfs-alloc-guard = { path = "crates/gvfs-alloc-guard" }

bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
http = "1.5"
http-body = "1.1"
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1", "http2"] }
memmap2 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
sha1 = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
webpki-roots = "1"

# Invariant 1 (100% safe Rust) and invariant 2 (zero panics): every member crate opts in
# with `[lints] workspace = true`. The two crates that cannot (`gvfs-mmap`: mmap(2) is an
# `unsafe fn`; `gvfs-alloc-guard`: `unsafe impl GlobalAlloc`) re-declare the same clippy
# denials and use `unsafe_code = "deny"` with one documented, audited exception each.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
