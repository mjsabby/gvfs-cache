[package]
name = "gvfs-alloc-guard"
description = "SealedAllocator: counts heap allocations on the hot path after warmup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `GlobalAlloc` can only be implemented through an `unsafe impl`, so this crate cannot
# inherit `unsafe_code = "forbid"`; every block forwards verbatim to `System`.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"
